base_image: anyscale/ray-ml:nightly-py39-gpu
env_vars: {}
debian_packages:
  - curl

post_build_cmds:
  # Install Ray
  - pip3 uninstall -y ray || true && uv pip install --system -U {{ env["RAY_WHEELS"] | default("ray") }}
  - {{ env["RAY_WHEELS_SANITY_CHECK"] | default("echo No Ray wheels sanity check") }}
