base_image: {{ env["RAY_IMAGE_ML_NIGHTLY_GPU"] }}
env_vars: {}
debian_packages:
  - curl

python:
  pip_packages:
    - pytest
  conda_packages: []

post_build_cmds:
  - pip3 uninstall ray -y || true && uv pip install --system -U {{ env["RAY_WHEELS"] | default("ray") }}
  - uv pip install --system crc32c
  - {{ env["RAY_WHEELS_SANITY_CHECK"] | default("echo No Ray wheels sanity check") }}
