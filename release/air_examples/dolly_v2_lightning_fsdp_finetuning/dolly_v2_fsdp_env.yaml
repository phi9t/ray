base_image: {{ env["RAY_IMAGE_ML_NIGHTLY_GPU"] | default("anyscale/ray:nightly-py38-cu118") }}
env_vars: {}
debian_packages:
  - curl

post_build_cmds:
  - pip uninstall -y ray || true && uv pip install --system -U {{ env["RAY_WHEELS"] | default("ray") }}
  - {{ env["RAY_WHEELS_SANITY_CHECK"] | default("echo No Ray wheels sanity check") }}
  - pip3 uninstall -y pytorch-lightning pytorch_lightning
  - uv pip install --system torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
  - uv pip install --system "lightning==2.0.2" "transformers==4.29.2" "accelerate==0.19.0"
